{% extends "alunos/base.html" %}

{% block conteudo %}
<h1 class="h3 mb-3">{{ titulo }}</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-success" type="submit">Salvar</button>
    <a class="btn btn-link" href="{% url 'lista' %}">Cancelar</a>
</form>
{% endblock %}
